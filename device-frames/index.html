<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Frames</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --line: #e4e4e7; --text: #18181b; --muted: #71717a;
    --ink: #18181b; --accent: #6c63ff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --card: #1c1c21; --line: #2e2e35; --text: #f4f4f5; --muted: #a1a1aa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width: 1200px; margin: 0 auto; padding: 32px 16px 8px; }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  header p { margin: 0 0 20px; color: var(--muted); max-width: 60ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  .controls label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  input[type=search] { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); min-width: 200px; }
  input[type=color] { width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 64px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { appearance: none; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 12px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; align-items: stretch; text-align: center; transition: border-color .15s, transform .15s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  .card .art { height: 200px; display: flex; align-items: center; justify-content: center; }
  .card .art svg { max-width: 100%; max-height: 100%; width: 100%; height: 100%; }
  .card .name { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .card .meta { font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  body.dark-preview .card { background: #1c1c21; border-color: #2e2e35; }
  body.dark-preview .card .name, body.dark-preview .card .meta { color: #a1a1aa; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; transition: .2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 40px; }
  footer a { color: inherit; }
  .card .art { background: repeating-conic-gradient(rgba(127,127,127,.12) 0 25%, transparent 0 50%) 0 0 / 16px 16px; border-radius: 8px; padding: 8px; }
</style>
</head>
<body>
<header>
  <h1>Device Frames</h1>
  <p>SVG mockups of phones, tablets, laptops, monitors, browser windows and a watch. Screens are transparent and their coordinates are documented, so screenshots drop straight in. Click any asset to copy its SVG markup.</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter…" aria-label="Filter assets">
    <label>Color <input type="color" id="ink" value="#18181b"></label>
    <label>Screenshot <input type="file" id="shot" accept="image/*"></label>
    <label><input type="checkbox" id="dark"> Dark cards</label>
    <span id="count" style="color:var(--muted);font-size:14px"></span>
  </div>
</header>
<main id="grid"></main>
<footer>Assets CC0 1.0 · code MIT · <a href="https://github.com/ghanemja/device-frames">github.com/ghanemja/device-frames</a></footer>
<div id="toast" role="status" aria-live="polite"></div>

ll-rule=\"evenodd\" d=\"M0 858H1560V866C1560 875 1520 884 1480 884H80C40 884 0 875 0 866ZM700 858H860V859A6 6 0 0 1 854 865H706A6 6 0 0 1 700 859V858Z\"/>\n\u003c/svg>"},{"name":"monitor","file":"svg/monitor.svg","title":"Desktop monitor","viewBox":[0,0,1968,1340],"screen":{"x":24,"y":24,"width":1920,"height":1080},"screenRadius":4,"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1968 1340\" fill=\"currentColor\" data-screen=\"24 24 1920 1080\" data-screen-radius=\"4\">\u003ctitle>Desktop monitor\u003c/title>\n\u003cpath fill-rule=\"evenodd\" d=\"M24 0H1944A24 24 0 0 1 1968 24V1140A24 24 0 0 1 1944 1164H24A24 24 0 0 1 0 1140V24A24 24 0 0 1 24 0ZM28 24H1940A4 4 0 0 1 1944 28V1100A4 4 0 0 1 1940 1104H28A4 4 0 0 1 24 1100V28A4 4 0 0 1 28 24Z\"/>\n\u003cpath fill=\"none\" stroke=\"#fff\" stroke-opacity=\".14\" stroke-width=\"2\" d=\"M24 3H1944A21 21 0 0 1 1965 24V1140A21 21 0 0 1 1944 1161H24A21 21 0 0 1 3 1140V24A21 21 0 0 1 24 3Z\"/>\n\u003cpath d=\"M904 1164H1064L1088 1318H880Z\" opacity=\".85\"/>\n\u003cpath d=\"M736 1316H1232A12 12 0 0 1 1244 1328V1328A12 12 0 0 1 1232 1340H736A12 12 0 0 1 724 1328V1328A12 12 0 0 1 736 1316Z\"/>\n\u003c/svg>"},{"name":"phone-android","file":"svg/phone-android.svg","title":"Android-style phone","viewBox":[0,0,384,820],"screen":{"x":10,"y":10,"width":360,"height":800},"screenRadius":34,"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 384 820\" fill=\"currentColor\" data-screen=\"10 10 360 800\" data-screen-radius=\"34\">\u003ctitle>Android-style phone\u003c/title>\n\u003cpath fill-rule=\"evenodd\" d=\"M44 0H336A44 44 0 0 1 380 44V776A44 44 0 0 1 336 820H44A44 44 0 0 1 0 776V44A44 44 0 0 1 44 0ZM44 10H336A34 34 0 0 1 370 44V776A34 34 0 0 1 336 810H44A34 34 0 0 1 10 776V44A34 34 0 0 1 44 10Z\"/>\n\u003cpath fill=\"none\" stroke=\"#fff\" stroke-opacity=\".14\" stroke-width=\"2\" d=\"M44 3H336A41 41 0 0 1 377 44V776A41 41 0 0 1 336 817H44A41 41 0 0 1 3 776V44A41 41 0 0 1 44 3Z\"/>\n\u003ccircle cx=\" <script>
  const assets = JSON.parse(document.getElementById('assets').textContent);
  const grid = document.getElementById('grid');
  const $ = (id) => document.getElementById(id);
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); }
    catch { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  }
  function meta(a) { return `screen ${a.screen.x} ${a.screen.y} ${a.screen.width}×${a.screen.height}`; }
  function render() {
    const q = $('q').value.trim().toLowerCase();
    const shown = assets.filter((a) => !q || (a.name + ' ' + a.title).toLowerCase().includes(q));
    grid.replaceChildren(...shown.map((a) => {
      const b = document.createElement('button');
      b.className = 'card'; b.type = 'button'; b.title = `${a.title}, click to copy`;
      b.innerHTML = `<div class="art">${preview(a)}</div><div class="name">${a.name}</div>` + (meta(a) ? `<div class="meta">${meta(a)}</div>` : '');
      b.onclick = () => copy(a.svg).then(() => toast(`Copied ${a.name}.svg`));
      return b;
    }));
    $('count').textContent = `${shown.length} of ${assets.length}`;
  }
  let preview = (a) => a.svg;
  $('q').oninput = render;
  $('ink').oninput = (e) => document.documentElement.style.setProperty('--ink', e.target.value);
  $('dark').onchange = (e) => {
    document.body.classList.toggle('dark-preview', e.target.checked);
    $('ink').value = e.target.checked ? '#f4f4f5' : '#18181b';
    $('ink').dispatchEvent(new Event('input'));
  };
  let shot = null;
  const rounded = ({ x, y, width: w, height: h }, r) => {
    const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r];
    const A = (q, ex, ey) => (q ? `A${q} ${q} 0 0 1 ${ex} ${ey}` : '');
    return `M${x + tl} ${y}H${x + w - tr}${A(tr, x + w, y + tr)}V${y + h - br}${A(br, x + w - br, y + h)}H${x + bl}${A(bl, x, y + h - bl)}V${y + tl}${A(tl, x + tl, y)}Z`;
  };
  preview = (a) => {
    if (!shot) return a.svg;
    const s = a.screen, id = 'clip-' + a.name;
    const inner = `<defs><clipPath id="${id}"><path d="${rounded(s, a.screenRadius)}"/></clipPath></defs>` +
      `<image href="${shot}" x="${s.x}" y="${s.y}" width="${s.width}" height="${s.height}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id})"/>`;
    return a.svg.replace('</title>', '</title>' + inner);
  };
  $('shot').onchange = (e) => { const f = e.target.files[0]; if (shot) URL.revokeObjectURL(shot); shot = f ? URL.createObjectURL(f) : null; render(); };
  if (matchMedia('(prefers-color-scheme: dark)').matches) { $('dark').checked = true; $('dark').onchange({ target: $('dark') }); }
  render();
</script>
</body>
</html>
