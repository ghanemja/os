<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regex Cookbook</title>
<meta name="description" content="Tested regular expressions with explanations, caveats and a live tester.">
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e7;
    --accent: #2f5bd3; --accent-soft: #e6edff; --ok: #1a7f37; --ok-soft: #e3f4e8; --bad: #c62828; --bad-soft: #fde8e8;
    --mark: #ffe58a; --code-bg: #f4f4f5;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --panel: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --accent: #8aa8ff; --accent-soft: #232c45; --ok: #5cc97a; --ok-soft: #17301f; --bad: #ff7b7b; --bad-soft: #3a1c1c;
      --mark: #6b5a12; --code-bg: #26262a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 12px 16px 40px; }
  aside { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); display: flex; flex-direction: column; gap: 8px; }
  input, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #list { list-style: none; margin: 0; padding: 0; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  #list li button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #list li:last-child button { border-bottom: 0; }
  #list li button:hover, #list li button:focus-visible { background: var(--code-bg); }
  #list li button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #list small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  h2 { margin: 0 0 4px; font-size: 20px; }
  h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--code-bg); color: var(--muted); }
  code, .mono { font-family: var(--mono); font-size: 13px; }
  code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
  .regex { display: block; padding: 10px 12px; overflow-x: auto; white-space: pre; background: var(--code-bg); border-radius: 8px; margin: 8px 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input.flags { width: 80px; flex: none; }
  button.copy { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; flex: none; }
  table { width: 100%; border-collapse: collapse; }
  td { border-top: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  td:first-child { width: 38%; word-break: break-all; }
  ul.caveats { margin: 0; padding-left: 20px; }
  .cases { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .case { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); word-break: break-all; }
  .pill { flex: none; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; }
  .pass { color: var(--ok); background: var(--ok-soft); }
  .fail { color: var(--bad); background: var(--bad-soft); }
  #output { white-space: pre-wrap; word-break: break-all; min-height: 3em; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; margin-top: 8px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  mark.zero { display: inline-block; width: 2px; height: 1.1em; vertical-align: text-bottom; background: var(--accent); }
  .status { margin-top: 8px; color: var(--muted); font-size: 13px; }
  .error { color: var(--bad); }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; }
    #list { max-height: 240px; }
    .cases { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Regex Cookbook</h1>
  <p>Tested regular expressions with piece-by-piece explanations. Pick a pattern, then edit it or the sample text and watch the matches update.</p>
</header>
<div class="layout">
  <aside>
    <input id="search" type="search" placeholder="Search patterns…" aria-label="Search patterns" autocomplete="off">
    <ul id="list" aria-label="Patterns"></ul>
  </aside>
  <main>
    <section id="detail" aria-live="polite"></section>
    <section>
      <h3>Live tester</h3>
      <div class="row">
        <input id="pattern" class="mono" aria-label="Pattern" spellcheck="false">
        <input id="flags" class="mono flags" aria-label="Flags" spellcheck="false">
        <button class="copy" id="copy" type="button">Copy</button>
      </div>
      <textarea id="input" rows="6" class="mono" aria-label="Test text" spellcheck="false" style="margin-top:8px"></textarea>
      <div id="output" class="mono" aria-label="Highlighted matches"></div>
      <div id="status" class="status"></div>
    </section>
    <section id="cases"></section>
  </main>
</div>

ttps://example.com:8080/a","HTTPS://EXAMPLE.ORG"],"nonMatches":["ftp://example.com","http://","example.com","https://exa mple.com","http://localhost"]},{"name":"domain","category":"web","pattern":"^(?=.{1,253}$)(?:(?!-)[a-z0-9-]{1,63}(?\u003c!-)\\.)+[a-z]{2,63}$","flags":"i","description":"A fully qualified domain name: dot-separated labels of up to 63 characters that do not start or end with a hyphen.","explanation":[["^(?=.{1,253}$)","lookahead: the whole name is at most 253 characters"],["(?!-)","a label may not start with a hyphen"],["[a-z0-9-]{1,63}","label of 1 to 63 letters, digits or hyphens"],["(?\u003c!-)","lookbehind: a label may not end with a hyphen"],["\\.","dot after each label"],["(?: ... )+","one or more labels"],["[a-z]{2,63}$","a letters-only top-level domain"]],"caveats":["Punycode (`xn--`) names pass. Raw Unicode names do not, so convert them first with `new URL()`.","Requires at least one dot, so single-label hosts like `localhost` fail."],"matches":["example.com","sub.example.co.uk","my-site.io","xn--bcher-kva.example"],"nonMatches":["-bad.com","bad-.com","localhost","exa_mple.com","example..com","example.c"]},{"name":"slug","category":"web","pattern":"^[a-z0-9]+(?:-[a-z0-9]+)*$","flags":"","description":"A URL slug: lowercase letters and digits in groups joined by single hyphens.","explanation":[["^[a-z0-9]+","starts with at least one lowercase letter or digit"],["(?:-[a-z0-9]+)*","any number of groups, each a hyphen followed by letters or digits"],["$","end of the string, so there is no trailing hyphen"]],"caveats":["ASCII only. Run the input through a slugify step first if it has accents or non-Latin text."],"matches":["hello-world","a","post-123","2026-recap"],"nonMatches":["Hello-World","-leading","trailing-","double--dash","with space"]},{"name":"html-tag","category":"web","pattern":"\u003c\\/?([a-z][a-z0-9-]*)\\b[^>]*>","flags":"i","description":"Finds an opening, closing or self-closing HTML tag and captures the tag name.","explanation ],"caveats":["Only the last extension is captured. For `.tar.gz` style double extensions, use `(\\.[a-z0-9]+)+$`."],"matches":["photo.jpg","archive.tar.gz","README.md","/path/to/file.TXT"],"nonMatches":["Makefile","folder/","file.",".bashrc","my.folder/file"]},{"name":"ipv4","category":"network","pattern":"^(?:(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]?\\d)$","flags":"","description":"A dotted-quad IPv4 address with each octet between 0 and 255 and no leading zeros.","explanation":[["25[0-5]","250 to 255"],["2[0-4]\\d","200 to 249"],["1\\d\\d","100 to 199"],["[1-9]?\\d","0 to 99, without a leading zero"],["(?:octet\\.){3}","three octets, each followed by a dot"],["(?:octet)$","the fourth octet, then the end of the string"]],"caveats":["Leading zeros (`010.0.0.1`) are rejected on purpose because some parsers read them as octal.","CIDR suffixes like `/24` are not accepted."],"matches":["192.168.1.1","0.0.0.0","255.255.255.255","10.0.0.254"],"nonMatches":["256.1.1.1","1.2.3","01.2.3.4","1.2.3.4.5","a.b.c.d"]},{"name":"ipv6","category":"network","pattern":"^(?:(?:[0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|(?:[0-9a-f]{1,4}:){1,7}:|(?:[0-9a-f]{1,4}:){1,6}:[0-9a-f]{1,4}|(?:[0-9a-f]{1,4}:){1,5}(?::[0-9a-f]{1,4}){1,2}|(?:[0-9a-f]{1,4}:){1,4}(?::[0-9a-f]{1,4}){1,3}|(?:[0-9a-f]{1,4}:){1,3}(?::[0-9a-f]{1,4}){1,4}|(?:[0-9a-f]{1,4}:){1,2}(?::[0-9a-f]{1,4}){1,5}|[0-9a-f]{1,4}:(?::[0-9a-f]{1,4}){1,6}|:(?:(?::[0-9a-f]{1,4}){1,7}|:))$","flags":"i","description":"An IPv6 address in full or `::`-compressed form.","explanation":[["[0-9a-f]{1,4}","one group of 1 to 4 hex digits (\"h\" below)"],["(?:h:){7}h","the full form: eight groups"],["(?:h:){1,7}:","compressed at the end, e.g. `fe80::`"],["(?:h:){n}(?::h){m}","the middle alternatives: `::` replaces a run of zero groups somewhere in the middle, with n + m ≤ 7"],["h:(?::h){1,6}","compressed right after the first group"],["(?:(?::h){1,7}|:)","compressed at the start, e.g. `::1`, or the bare `::`"],["i flag"," 00-0000-0000-0000-000000000000","123e4567e89b12d3a456426614174000","123e4567-e89b-12d3-c456-426614174000","g23e4567-e89b-12d3-a456-426614174000","123e4567-e89b-12d3-a456-42661417400"]},{"name":"semver","category":"identifiers","pattern":"^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$","flags":"","description":"A Semantic Versioning 2.0.0 version string, using the official regex from semver.org. It captures major, minor, patch, prerelease and build.","explanation":[["(0|[1-9]\\d*)","groups 1 to 3: major, minor and patch, as non-negative integers without leading zeros"],["\\.","dots between them"],["(?:-(...))?","optional group 4: prerelease after `-`, as dot-separated identifiers"],["0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*","a prerelease identifier is a number without leading zeros or an alphanumeric string"],["(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?","optional group 5: build metadata after `+`"]],"caveats":["A leading `v` (`v1.2.3`) is not part of semver, so strip it first.","Ranges like `^1.2.0` are not versions and do not match."],"matches":["1.0.0","0.1.2-alpha.1","2.3.4+build.5","1.0.0-rc.1+sha.abc123"],"nonMatches":["1.0","v1.0.0","01.0.0","1.0.0-","1.0.0-01"]},{"name":"git-sha","category":"identifiers","pattern":"^(?:[0-9a-f]{7,40}|[0-9a-f]{64})$","flags":"","description":"A git commit hash: an abbreviated or full SHA-1 (7 to 40 hex digits) or a full SHA-256 (64 hex digits).","explanation":[["[0-9a-f]{7,40}","SHA-1, from the shortest usual abbreviation (7) up to full length (40)"],["|[0-9a-f]{64}","or a full SHA-256 object name"],["^ ... $","the whole string is the hash"]],"caveats":["Git prints lowercase hex, so uppercase is rejected. Add the `i` flag if your input may be uppercase.","Any hex word of 7 or more characters, such as `deadbeef`, will pass."],"matches":["a1b2c3d","3f786850e387550fdab836ed7e6dc881de230 s","pattern":"^-?[$€£¥]\\s?(?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d{2})?$","flags":"","description":"A money amount with a leading currency symbol (`$`, `€`, `£`, `¥`), optional thousands separators and an optional two-digit cents part.","explanation":[["^-?","optional minus sign before the symbol"],["[$€£¥]","one currency symbol (inside a character class, `$` is literal)"],["\\s?","optional space"],["(?:\\d{1,3}(?:,\\d{3})+|\\d+)","either a grouped number like `1,234` or plain digits"],["(?:\\.\\d{2})?$","optional cents: exactly two decimals"]],"caveats":["Trailing symbols (`12 €`), ISO codes (`USD 5`) and currencies with 0 or 3 decimals are not handled.","Do not parse money into floating point. Store integer minor units."],"matches":["$1,234.56","€99","£0.99","$1000","-$5.00"],"nonMatches":["1,234.56","$1.5","$1,23","$","12$"]},{"name":"credit-card-shape","category":"numbers","pattern":"^(?:\\d[ -]?){12,18}\\d$","flags":"","description":"A string shaped like a payment card number: 13 to 19 digits, optionally grouped with single spaces or hyphens.","explanation":[["(?:\\d[ -]?){12,18}","12 to 18 digits, each optionally followed by one space or hyphen"],["\\d$","it must end on a digit, for 13 to 19 digits in total"]],"caveats":["This checks shape only. Apply the Luhn checksum separately (strip separators, double every second digit from the right, and the sum must be divisible by 10).","Never log or store full card numbers. PCI DSS applies."],"matches":["4111 1111 1111 1111","4111-1111-1111-1111","4111111111111111","378282246310005"],"nonMatches":["4111 1111 1111","4111--1111-1111-1111","abcd efgh ijkl mnop","4111 1111 1111 1111 1111","4111111111111111 "]},{"name":"lat-long","category":"numbers","pattern":"^[-+]?(?:[1-8]?\\d(?:\\.\\d+)?|90(?:\\.0+)?),\\s*[-+]?(?:180(?:\\.0+)?|(?:1[0-7]\\d|[1-9]?\\d)(?:\\.\\d+)?)$","flags":"","description":"A \"latitude,longitude\" decimal pair, with latitude between -90 and 90 and longitude between -180 and 180.","explanation":[["^[-+] ":"strong-password","category":"encoding","pattern":"^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9\\s]).{8,}$","flags":"","description":"Checks that a password has at least 8 characters with a lowercase letter, an uppercase letter, a digit and a symbol. Each requirement is a separate lookahead.","explanation":[["^(?=.*[a-z])","somewhere ahead there is a lowercase letter"],["(?=.*[A-Z])","...an uppercase letter"],["(?=.*\\d)","...a digit"],["(?=.*[^A-Za-z0-9\\s])","...a symbol (not a letter, digit or whitespace)"],[".{8,}$","and the whole thing is at least 8 characters"]],"caveats":["NIST SP 800-63B advises against composition rules. Prefer length (12 or more), a check against breached-password lists, and a strength estimator such as zxcvbn.","`.` does not match newlines, which is fine for passwords."],"matches":["Passw0rd!","C0mpl3x#Pass","aB3$efgh","Tr0ub4dor&3"],"nonMatches":["password","PASSWORD1!","Passw0rd","Pa0!","passw0rd!"]},{"name":"trailing-whitespace","category":"text","pattern":"[ \\t]+$","flags":"m","description":"Finds spaces or tabs at the end of any line. Use it with `replace(/[ \\t]+$/gm, \"\")` to strip them.","explanation":[["[ \\t]+","one or more spaces or tabs"],["$","end of a line, because of the `m` flag"],["m flag","makes `$` match before every `\\n`, not only at the end of the string"]],"caveats":["With Windows line endings, `\\r` sits before `\\n` and `$` does not match before it. Use `[ \\t]+(?=\\r?$)` for CRLF files."],"matches":["line ","tab\t","multi\nline  \nend","   "],"nonMatches":["clean","clean\nlines",""," leading"]},{"name":"duplicate-words","category":"text","pattern":"\\b(\\w+)\\s+\\1\\b","flags":"i","description":"Finds a word repeated twice in a row, such as \"the the\", including across a line break. A classic proofreading check.","explanation":[["\\b(\\w+)","group 1: a whole word"],["\\s+","whitespace between them, newlines included"],["\\1\\b","the same word again (backreference), ending at a word boundary so \"the theory\" does not match"],["i flag","case-insensitive, so \"Hello hello\" matches"]],"caveats":["Some repeats are correct (\"had had\", \"that that\"), so review matches rather than auto-fixing.","`\\w` is ASCII-only. Use `[\\p{L}\\p{N}_]` with the `u` flag for other scripts."],"matches":["the the","This is is a test","Paris in the\nthe spring","Hello hello"],"nonMatches":["the theory","no duplicates here","the cat the dog","a b a"]},{"name":"camelcase-split","category":"text","pattern":"(?\u003c=[a-z0-9])(?=[A-Z])|(?\u003c=[A-Z])(?=[A-Z][a-z])","flags":"g","description":"Zero-width split points inside camelCase and PascalCase identifiers. `\"XMLHttpRequest\".split(re)` gives `[\"XML\", \"Http\", \"Request\"]`.","explanation":[["(?\u003c=[a-z0-9])(?=[A-Z])","a position after a lowercase letter or digit and before an uppercase letter (`camel|Case`)"],["|","or"],["(?\u003c=[A-Z])(?=[A-Z][a-z])","a position inside a run of capitals, just before the last one when a lowercase letter follows (`XML|Http`)"],["g flag","needed for `matchAll`. `split` finds every position anyway"]],"caveats":["The match is empty (zero-width), so use it with `split`, or with `replace(re, \" \")` to add spaces.","ASCII letters only."],"matches":["camelCase","XMLHttpRequest","getHTTPResponse","version2Update"],"nonMatches":["lowercase","UPPERCASE","Capitalized","snake_case"]}]</script>

<script>
  const patterns = JSON.parse(document.getElementById('cookbook-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  let current = null;

  function renderList() {
    const q = $('search').value.trim().toLowerCase();
    const hits = patterns.filter((p) => !q || [p.name, p.category, p.description].join(' ').toLowerCase().includes(q));
    $('list').innerHTML = hits.map((p) =>
      `<li><button type="button" data-name="${p.name}" aria-current="${p === current}">${p.name}<small>${esc(p.category)}</small></button></li>`
    ).join('') || '<li style="padding:8px 10px;color:var(--muted)">No patterns found</li>';
  }

  function select(name, keepHash) {
    current = patterns.find((p) => p.name === name) || patterns[0];
    if (!keepHash) history.replaceState(null, '', '#' + current.name);
    const p = current;
    $('detail').innerHTML = `
      <h2>${p.name} <span class="tag">${esc(p.category)}</span></h2>
      <p>${md(p.description)}</p>
      <code class="regex">/${esc(p.pattern)}/${p.flags}</code>
      <h3>Explanation</h3>
      <table>${p.explanation.map(([a, b]) => `<tr><td><code>${esc(a)}</code></td><td>${md(b)}</td></tr>`).join('')}</table>
      ${p.caveats.length ? `<h3 style="margin-top:12px">Caveats</h3><ul class="caveats">${p.caveats.map((c) => `<li>${md(c)}</li>`).join('')}</ul>` : ''}`;
    $('pattern').value = p.pattern;
    $('flags').value = p.flags;
    $('input').value = p.matches.concat(p.nonMatches).join('\n');
    renderList();
    renderCases();
    runTester();
  }

  function compile() {
    try {
      return new RegExp($('pattern').value, $('flags').value);
    } catch (err) {
      return err;
    }
  }

  function renderCases() {
    const p = current;
    const re = compile();
    const row = (s, expected) => {
      let got = false;
      if (re instanceof RegExp) { re.lastIndex = 0; got = re.test(s); }
      const ok = got === expected;
      return `<div class="case"><span class="pill ${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span><span class="mono">${esc(JSON.stringify(s))}</span></div>`;
    };
    $('cases').innerHTML = `<h3>Test cases (run against the pattern above)</h3><div class="cases">
      <div><strong>Should match</strong>${p.matches.map((s) => row(s, true)).join('')}</div>
      <div><strong>Should not match</strong>${p.nonMatches.map((s) => row(s, false)).join('')}</div></div>`;
  }

  function runTester() {
    const text = $('input').value;
    const re = compile();
    if (!(re instanceof RegExp)) {
      $('output').textContent = text;
      $('status').innerHTML = `<span class="error">${esc(re.message)}</span>`;
      return;
    }
    const g = new RegExp(re.source, re.flags.includes('g') ? re.flags : re.flags + 'g');
    let html = '';
    let last = 0;
    let count = 0;
    for (const m of text.matchAll(g)) {
      count++;
      html += esc(text.slice(last, m.index));
      html += m[0] ? `<mark title="match ${count}">${esc(m[0])}</mark>` : '<mark class="zero" title="zero-width match"></mark>';
      last = m.index + m[0].length;
      if (count > 5000) break;
    }
    html += esc(text.slice(last));
    $('output').innerHTML = html || '&nbsp;';
    $('status').textContent = `${count} match${count === 1 ? '' : 'es'} in the whole text` +
      (current && re.source !== current.pattern ? ' · pattern edited' : '');
    renderCases();
  }

  $('search').addEventListener('input', renderList);
  $('list').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-name]');
    if (b) select(b.dataset.name);
  });
  for (const id of ['pattern', 'flags', 'input']) $(id).addEventListener('input', runTester);
  $('copy').addEventListener('click', async () => {
    const text = `/${$('pattern').value}/${$('flags').value}`;
    try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Copied'; }
    catch { $('copy').textContent = 'Copy failed'; }
    setTimeout(() => ($('copy').textContent = 'Copy'), 1200);
  });
  window.addEventListener('hashchange', () => select(decodeURIComponent(location.hash.slice(1)), true));
  select(decodeURIComponent(location.hash.slice(1)), !location.hash);
</script>
</body>
</html>
