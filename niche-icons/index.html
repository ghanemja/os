<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>niche-icons</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; --accent: #15803d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --card: #292524; --line: #44403c; --accent: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 32px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  header p { margin: 0 0 16px; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  input[type=search] { flex: 1 1 220px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
  label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  button.icon { all: unset; cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: border-color .15s, transform .15s; }
  button.icon:hover, button.icon:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
  button.icon[hidden], section[hidden] { display: none; }
  button.icon svg { width: var(--size, 32px); height: var(--size, 32px); stroke-width: var(--sw, 2); }
  button.icon span { font-size: 12px; color: var(--muted); text-align: center; word-break: break-word; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px; }
</style>
</head>
<body>
<header>
  <h1>niche-icons</h1>
  <p>Line icons for farming, lab science, trades and music gear. 24×24, 2px stroke, <code>currentColor</code>. Click an icon to copy its SVG.</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Search icons…" aria-label="Search icons">
    <label>Size <input type="range" id="size" min="16" max="64" value="32"></label>
    <label>Stroke <input type="range" id="sw" min="1" max="3" step="0.25" value="2"></label>
  </div>
</header>
<main id="gallery"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer>Icons CC0 1.0 · Code MIT · <a href="https://github.com/ghanemja/niche-icons" style="color:inherit">github.com/ghanemja/niche-icons</a></footer>

/* ICONS:END */

const gallery = document.getElementById('gallery');
const toast = document.getElementById('toast');
let toastTimer;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
}

for (const [category, names] of Object.entries(CATEGORIES)) {
  const section = document.createElement('section');
  section.innerHTML = `<h2>${category} <small>(${names.length})</small></h2><div class="grid"></div>`;
  const grid = section.querySelector('.grid');
  for (const name of names) {
    const btn = document.createElement('button');
    btn.className = 'icon';
    btn.dataset.name = name;
    btn.title = `Copy ${name}.svg`;
    btn.innerHTML = ICONS[name] + `<span>${name}</span>`;
    btn.addEventListener('click', () => copy(ICONS[name]).then(() => showToast(`Copied ${name}.svg`)));
    grid.appendChild(btn);
  }
  gallery.appendChild(section);
}

document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const section of gallery.children) {
    let visible = 0;
    for (const btn of section.querySelectorAll('button')) {
      const show = !q || btn.dataset.name.includes(q);
      btn.hidden = !show; visible += show;
    }
    section.hidden = !visible;
  }
});
document.getElementById('size').addEventListener('input', (e) => gallery.style.setProperty('--size', e.target.value + 'px'));
document.getElementById('sw').addEventListener('input', (e) => gallery.style.setProperty('--sw', e.target.value));
</script>
